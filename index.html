<!DOCTYPE html>
<html>
  <head>
    <title>31</title>
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <header>ДЗ 31. Гамбургер</header>
    <form>
      <div class="size">
        <h2>Step 1: Choose size of your Hamburger</h2>
        <input type="radio" name="hamburger-size" id="hamburger-small" />
        <label for="hamburger-small">Small </label>

        <input type="radio" name="hamburger-size" id="hamburger-large" />
        <label for="hamburger-large">Large </label>
      </div>

      <div class="stuffing">
        <h2>Step 2: Choose one stuffing</h2>
        <input type="radio" name="stuffing" id="cheese" />
        <label for="cheese-stuffing">Cheese </label>

        <input type="radio" name="stuffing" id="salad" />
        <label for="salad-stuffing">Salad </label>

        <input type="radio" name="stuffing" id="potatoes" />
        <label for="potatoes-stuffing">Potatoes </label>
      </div>

      <div class="additionals">
        <h2>Step 3: Anything in addition? (optional)</h2>
        <input
          name="toppings"
          value="SEASONING"
          type="checkbox"
          id="seasoning"
        />
        <label for="seasoning">Seasoning</label>

        <input name="toppings" value="MAYO" type="checkbox" id="mayo" />
        <label for="mayo">Mayonnaise </label>
      </div>

      <button type="submit">Buy</button>
    </form>

    <script src="myscripts.js"></script>
  </body>
</html>
