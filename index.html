<!DOCTYPE html>
<html>
  <head>
    <title>28</title>
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <header>
      <h3>ДЗ 28. Сутності людини та автомобіля</h3>
    </header>
    <form>
      <div class="owner-div">
        <label for="owner-name">Owner's name</label>
        <input type="text" id="owner-name" />

        <label for="owner-age">Owner's age</label>
        <input type="number" id="owner-age" />
      </div>

      <div class="car-div">
        <label for="car-name">Brand/Name of their car</label>
        <input type="text" id="car-name" />

        <label for="car-color">Color of the car</label>
        <input type="text" id="car-color" />
      </div>

      <button type="submit">Submit</button>
    </form>

    <script src="myscripts.js"></script>
  </body>
